  <g font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="11" fill="#0b1020">
    <rect x="20" y="330" width="760" height="34" rx="3" fill="#6ea8f0"/><text x="30" y="352">main</text>
    <rect x="20" y="290" width="250" height="34" rx="3" fill="#7fb7e8"/><text x="30" y="312">parse_request</text>
    <rect x="276" y="290" width="470" height="34" rx="3" fill="#f0a25a"/><text x="286" y="312">handle_order</text>
    <rect x="30" y="250" width="150" height="34" rx="3" fill="#8fc4de"/><text x="40" y="272">decode</text>
    <rect x="286" y="250" width="400" height="34" rx="3" fill="#f2b06a"/><text x="296" y="272">load_pricing_table</text>

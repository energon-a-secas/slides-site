# ── Presentation Sage — starter template ──────────────────────────────────────
# Copy this file, rename it, and start filling in your content.
# Open index.html in a browser, paste the YAML, and the preview updates live.
# See CLAUDE.md for the full schema, slide types, and coaching rules.

presentation:
  title: "Your Presentation Title"
  subtitle: "A short subtitle that frames the talk"
  author: "Your Name"
  date: "YYYY-MM"
  # theme: royal          # optional deck-wide look — full list in CLAUDE.md (Deck themes)
  # pattern: dots         # optional background texture: dots, grid, diagonal, rings, orbs
  # logo: "https://…"     # URL, data: URI (toolbar ◉ Logo embeds a local file), or "placeholder" for drafts
  # logo_all: true        # stamp it on every non-title slide · logo_pos: bottom-left picks the corner
  # logo_size: 96         # bigger logo on the title slide only (px height, 16–240)
  # logo_stamp_size: 44   # bigger stamp on the other slides (px height, 12–120)
  # brand:                # brand colors override the theme — decks for one brand stay consistent
  #   accent: "#e50914"
  # footer: "Team · Q3"   # deck note on the bottom rail of every non-title slide
  # classification: "Internal"  # handling label, sits beside the page count

  slides:

    # ── Title slide (always first) ────────────────────────────────────────────
    - type: title
      heading: "Your Presentation Title"
      subtitle: "A short subtitle that frames the talk"

    # ── Agenda (auto reads the divider headings below, so it cannot drift) ───
    - type: agenda
      auto: true

    # ── Context / problem (1 slide — make the pain real) ─────────────────────
    - type: bullets
      heading: "The Problem"
      # Coach: ≤5 bullets, ≤10 words each. Fragments beat full sentences.
      bullets:
        - "Bullet one — the first pain point"
        - "Bullet two — concrete, with a number"
        - "Bullet three — keep it to what the audience feels"

    # ── Before / after or option comparison ──────────────────────────────────
    - type: split
      heading: "Before vs After"
      left:
        heading: "Now"
        bullets:
          - "Current state item 1"
          - "Current state item 2"
      right:
        heading: "Target"
        bullets:
          - "Future state item 1"
          - "Future state item 2"

    # ── Q&A pause (add one every 4–5 slides) ─────────────────────────────────
    - type: qa
      heading: "Does this match your experience?"
      subtext: "Take a moment to check — does this resonate before we go deeper?"

    # ── Section break ─────────────────────────────────────────────────────────
    - type: divider
      heading: "The Solution"
      subtitle: "What we're proposing and why"

    # ── Solution detail ───────────────────────────────────────────────────────
    - type: bullets
      heading: "How It Works"
      bullets:
        - "Step or concept 1"
        - "Step or concept 2"
        - "Step or concept 3"

    # ── Code example (optional — max 15 lines) ────────────────────────────────
    - type: code
      heading: "Example"
      language: python
      code: |
        # Show only the part that matters
        result = do_the_thing(input)

    # ── Section break ─────────────────────────────────────────────────────────
    - type: divider
      heading: "What It Costs"
      subtitle: "The trade-off, stated plainly"

    # ── Options the audience will read across (≤6 columns, ≤8 rows) ──────────
    - type: table
      heading: "What each option costs"
      columns: ["Option", "Cost", "Risk"]
      align: [left, right, center]
      highlight: 2          # the row you are recommending
      rows:
        - ["Keep as is", "$0", "High"]
        - ["Rebuild", "$40k", "Low"]
      caption: "Where the numbers came from"

    # ── 2 to 4 parallel points that are not a sequence ───────────────────────
    - type: grid
      heading: "Three things this buys you"
      columns: 3
      items:
        - icon: "◆"
          heading: "First"
          text: "What it means in practice"
        - icon: "▲"
          heading: "Second"
          text: "What it means in practice"
        - icon: "●"
          heading: "Third"
          text: "What it means in practice"

    # ── A screenshot that needs interpreting (omit src for a placeholder) ────
    - type: media
      heading: "What it looks like"
      # src: "./screenshot.png"   # add it and the placeholder frame is replaced
      alt: "Description for the reader who cannot see it"
      side: right
      bullets:
        - "Point at the thing that changed"
        - "Say why it matters"

    # ── Supporting quote or principle ─────────────────────────────────────────
    - type: quote
      text: "A short, memorable principle or user quote that reinforces the point."
      source: "Source or author"

    # ── Final CTA (one clear action — not 'Questions?') ───────────────────────
    - type: cta
      heading: "Next Step"
      action: "The single thing the audience should do"
      subtext: "Where to find it or who to contact"
